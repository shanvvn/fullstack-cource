version: '3.8'

services:
  app-backend:
    build: ./todo-backend
    ports:
      - 3000:3000
    environment:
      - MONGO_URL=mongodb://the_username:the_password@mongo:27017/the_database
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  app-frontend:
    build: ./todo-frontend
    ports:
      - 8080:80
    depends_on:
      - app-backend

  mongo:
    image: mongo
    ports:
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: the_username
      MONGO_INITDB_ROOT_PASSWORD: the_password
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis
    ports:
      - 6379:6379

volumes:
  mongo-data:
